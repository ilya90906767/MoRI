server {
    server_name nanoscript-land.ru www.nanoscript-land.ru;

    root /var/www/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
    location /api {
        proxy_pass http://localhost:8000/api;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/nanoscript-land.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/nanoscript-land.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.nanoscript-land.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = nanoscript-land.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name nanoscript-land.ru www.nanoscript-land.ru;
    return 404; # managed by Certbot
}